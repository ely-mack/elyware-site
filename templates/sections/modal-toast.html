<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Toast | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<!-- SECTION START: modal-toast -->
<section class="section">
    <div class="container hero-center stack">
        <span class="eyebrow">Dialog and toast</span>
        <h2>Native dialog. No library.</h2>
        <div class="btn-row">
            <button class="btn btn-primary" type="button" data-open="signup-modal">Open dialog</button>
            <button class="btn btn-ghost" type="button" data-toast="Saved. That is a toast.">Show toast</button>
        </div>
        <dialog class="modal" id="signup-modal" aria-labelledby="signup-modal-title">
            <div class="stack">
                <h3 id="signup-modal-title">Get presale codes</h3>
                <p class="muted">Escape, the close button, or a click outside closes this.</p>
                <form method="dialog" class="signup">
                    <label class="sr-only" for="modal-email">Email address</label>
                    <input class="field" id="modal-email" type="email" placeholder="you@email.com" autocomplete="email">
                    <button class="btn btn-primary" type="submit">Join</button>
                </form>
            </div>
            <button class="icon-btn close" type="button" data-close aria-label="Close">&times;</button>
        </dialog>
    </div>
</section>
<!-- SECTION END: modal-toast -->
</body>
</html>
