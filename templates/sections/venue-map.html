<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Map | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<!-- SECTION START: venue-map -->
<section class="section" id="seating">
    <div class="container">
        <div class="section-head stack">
            <span class="eyebrow">Seating</span>
            <h2>Pick where you want to be.</h2>
        </div>
        <div class="venue-map">
            <svg viewBox="0 0 600 420" role="group" aria-label="Venue floor plan">
                <rect class="stage" x="150" y="20" width="300" height="56" rx="10"/>
                <text class="stage-label" x="300" y="54" text-anchor="middle">STAGE</text>
                <g data-zone="General admission floor" data-price="$35" data-note="Standing room in front of the stage. All ages." tabindex="0" role="button">
                    <rect class="shape" x="120" y="100" width="360" height="150" rx="12"/>
                    <text x="300" y="180" text-anchor="middle">GA Floor</text>
                </g>
                <g data-zone="Left balcony" data-price="$55" data-note="Reserved seats with a side view. Bar access." tabindex="0" role="button">
                    <rect class="shape" x="20" y="100" width="84" height="240" rx="12"/>
                    <text x="62" y="225" text-anchor="middle">Left</text>
                </g>
                <g data-zone="Right balcony" data-price="$55" data-note="Reserved seats with a side view. Bar access." tabindex="0" role="button" class="sold">
                    <rect class="shape" x="496" y="100" width="84" height="240" rx="12"/>
                    <text x="538" y="225" text-anchor="middle">Right</text>
                </g>
                <g data-zone="VIP deck" data-price="$95" data-note="Private bar, restrooms and the best sightline in the room. 21+." tabindex="0" role="button">
                    <rect class="shape" x="120" y="270" width="360" height="70" rx="12"/>
                    <text x="300" y="310" text-anchor="middle">VIP Deck</text>
                </g>
                <rect x="250" y="370" width="100" height="30" rx="6" fill="none" stroke="currentColor" stroke-dasharray="4 4" opacity="0.4"/>
                <text x="300" y="390" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.6">Entrance</text>
            </svg>
            <div class="card zone-panel" aria-live="polite">
                <span class="eyebrow">Selected</span>
                <h3 data-zone-name>Pick a section</h3>
                <p class="price" data-zone-price>From $35</p>
                <p class="muted" data-zone-note>Click or tab to a section on the map. Enter selects it.</p>
                <a class="btn btn-primary" href="#" data-zone-buy hidden>Get tickets</a>
                <ul class="legend">
                    <li><i></i> Available</li>
                    <li><i class="sel"></i> Selected</li>
                    <li><i class="sold"></i> Sold out</li>
                </ul>
            </div>
        </div>
    </div>
</section>
<!-- SECTION END: venue-map -->
</body>
</html>
