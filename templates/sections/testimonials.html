<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<!-- SECTION START: testimonials -->
<section class="section alt">
    <div class="container">
        <div class="section-head center stack">
            <span class="eyebrow">Results</span>
            <h2>What clients say.</h2>
        </div>
        <div class="grid cols-3">
            <blockquote class="card quote" data-reveal>
                <p>"Replace with a real quote. Specific numbers beat praise."</p>
                <footer><span class="avatar" aria-hidden="true">JD</span><div><cite>Client Name</cite><small>Title, Company</small></div></footer>
            </blockquote>
            <blockquote class="card quote" data-reveal>
                <p>"Keep each quote under 30 words. Cut the adjectives."</p>
                <footer><span class="avatar" aria-hidden="true">AK</span><div><cite>Client Name</cite><small>Title, Company</small></div></footer>
            </blockquote>
            <blockquote class="card quote" data-reveal>
                <p>"Only publish quotes you have written permission to use."</p>
                <footer><span class="avatar" aria-hidden="true">MR</span><div><cite>Client Name</cite><small>Title, Company</small></div></footer>
            </blockquote>
        </div>
    </div>
</section>
<!-- SECTION END: testimonials -->
</body>
</html>
