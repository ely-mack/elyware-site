<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<!-- SECTION START: carousel -->
<section class="section">
    <div class="container">
        <div class="carousel">
            <div class="section-head stack">
                <span class="eyebrow">Recent work</span>
                <h2>Swipe or use the arrows.</h2>
            </div>
            <div class="carousel-controls">
                <button class="icon-btn" type="button" data-carousel-prev aria-label="Previous">&larr;</button>
                <button class="icon-btn" type="button" data-carousel-next aria-label="Next">&rarr;</button>
            </div>
            <div class="carousel-track" tabindex="0" aria-label="Recent work">
                <article class="card stack"><div class="media"></div><h3>Project one</h3><p class="muted small">One line result.</p></article>
                <article class="card stack"><div class="media"></div><h3>Project two</h3><p class="muted small">One line result.</p></article>
                <article class="card stack"><div class="media"></div><h3>Project three</h3><p class="muted small">One line result.</p></article>
                <article class="card stack"><div class="media"></div><h3>Project four</h3><p class="muted small">One line result.</p></article>
                <article class="card stack"><div class="media"></div><h3>Project five</h3><p class="muted small">One line result.</p></article>
            </div>
        </div>
    </div>
</section>
<!-- SECTION END: carousel -->
</body>
</html>
