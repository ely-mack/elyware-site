<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<!-- SECTION START: events -->
<section class="section" id="shows">
    <div class="container">
        <div class="section-head stack">
            <span class="eyebrow">Upcoming</span>
            <h2>On sale now.</h2>
        </div>
        <ul class="event-list">
            <li class="event" data-reveal>
                <time class="event-date" datetime="2026-11-14"><span class="mon">Nov</span><span class="day">14</span><span class="dow">Sat</span></time>
                <div><h3>Headliner Name</h3><p class="event-meta">with Support Act &middot; Venue Name, City &middot; Doors 7pm</p></div>
                <div><a class="btn btn-primary btn-sm" href="#">Tickets</a></div>
            </li>
            <li class="event" data-reveal>
                <time class="event-date" datetime="2026-11-21"><span class="mon">Nov</span><span class="day">21</span><span class="dow">Sat</span></time>
                <div><h3>Headliner Name</h3><p class="event-meta">Venue Name, City &middot; Doors 8pm &middot; 21+</p></div>
                <div><a class="btn btn-primary btn-sm" href="#">Tickets</a></div>
            </li>
            <li class="event sold-out" data-reveal>
                <time class="event-date" datetime="2026-12-05"><span class="mon">Dec</span><span class="day">05</span><span class="dow">Sat</span></time>
                <div><h3>Headliner Name</h3><p class="event-meta">Venue Name, City &middot; Doors 7pm</p></div>
                <div><span class="status">Sold out</span></div>
            </li>
        </ul>
    </div>
</section>
<!-- SECTION END: events -->
</body>
</html>
