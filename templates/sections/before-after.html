<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before After | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<!-- SECTION START: before-after -->
<section class="section">
    <div class="container narrow">
        <div class="section-head center stack">
            <span class="eyebrow">Redesign</span>
            <h2>Drag to compare.</h2>
        </div>
        <div class="compare">
            <div class="media" aria-hidden="true"></div>
            <div class="media after" aria-hidden="true"></div>
            <span class="tag l">Before</span>
            <span class="tag r">After</span>
            <input type="range" min="0" max="100" value="50" aria-label="Before and after comparison position">
            <div class="divider" aria-hidden="true"></div>
        </div>
        <p class="note">Swap each .media for an &lt;img&gt; of the same size. Arrow keys move the slider.</p>
    </div>
</section>
<!-- SECTION END: before-after -->
</body>
</html>
