<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Progress Counters | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<!-- SECTION START: scroll-progress-counters -->
<div class="scroll-progress" aria-hidden="true"></div>
<section class="section alt" aria-label="By the numbers">
    <div class="container">
        <div class="section-head center stack">
            <span class="eyebrow">Counters and progress</span>
            <h2>Numbers count up once. The bar tracks scroll.</h2>
        </div>
        <div class="grid cols-4">
            <div class="stat"><strong data-count="120" data-suffix="+">120+</strong><span>Shows a year</span></div>
            <div class="stat"><strong data-count="45000">45,000</strong><span>Tickets sold</span></div>
            <div class="stat"><strong data-count="8">8</strong><span>Partner venues</span></div>
            <div class="stat"><strong data-count="98" data-suffix="%">98%</strong><span>Would come back</span></div>
        </div>
    </div>
</section>
<div class="demo-spacer" aria-hidden="true"></div>
<!-- SECTION END: scroll-progress-counters -->
</body>
</html>
