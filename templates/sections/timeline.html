<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

    <title>Timeline | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">

<body>
<!-- SECTION START: timeline -->
<section class="section" id="schedule">
    <div class="container narrow">
        <div class="section-head stack">
            <span class="eyebrow">Day of show</span>
            <h2>Schedule.</h2>
        </div>
        <ol class="timeline">
            <li><time datetime="18:00">6:00 PM</time><h3>Doors</h3><p class="muted">Bars open. Merch opens.</p></li>
            <li class="now"><time datetime="19:00">7:00 PM</time><h3>Support Act</h3><p class="muted">45 minute set.</p></li>
            <li><time datetime="20:15">8:15 PM</time><h3>Direct Support</h3><p class="muted">60 minute set.</p></li>
            <li><time datetime="21:30">9:30 PM</time><h3>Headliner</h3><p class="muted">90 minute set. Curfew 11pm.</p></li>
        </ol>
    </div>
</section>
<!-- SECTION END: timeline -->
</body>
</html>
