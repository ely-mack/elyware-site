<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Bar | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<!-- SECTION START: sticky-bar -->
<section class="hero" id="sticky-marker">
    <div class="container hero-center stack">
        <h1>Scroll down on a phone.</h1>
        <p class="lead">The ticket bar slides up once this hero leaves the screen. It only shows under 760px wide.</p>
    </div>
</section>
<div class="demo-spacer" aria-hidden="true"></div>
<div class="sticky-bar" data-sticky-after="#sticky-marker">
    <div><strong>Headliner Name</strong><small>Sat, Nov 14 &middot; Doors 7pm</small></div>
    <a class="btn btn-primary btn-sm" href="#">Get tickets</a>
</div>
<!-- SECTION END: sticky-bar -->
</body>
</html>
