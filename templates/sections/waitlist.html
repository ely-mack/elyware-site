<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<!-- SECTION START: waitlist -->
<section class="section">
    <div class="container narrow">
        <div class="cta-band waitlist">
            <span class="eyebrow">Early access</span>
            <h2>Get in line.</h2>
            <p class="lead">Join the list and see your spot right away.</p>
            <form class="signup" action="/api/waitlist" method="POST" data-waitlist>
                <label class="sr-only" for="waitlist-email-live">Email address</label>
                <input class="field" id="waitlist-email-live" type="email" name="email" placeholder="you@email.com" autocomplete="email" required>
                <button class="btn btn-primary" type="submit">Join</button>
            </form>
            <p class="position" data-position aria-live="polite"></p>
            <p class="muted joined-only">That is your place in line. Share it to move up.</p>
            <div class="share-row btn-row">
                <button class="btn btn-ghost btn-sm" type="button" data-copy="https://example.com/waitlist" data-copied="Link copied">Copy invite link</button>
            </div>
            <p class="form-status" role="status" aria-live="polite"></p>
        </div>
        <p class="note">Needs functions/waitlist.mjs deployed as a Netlify function. From a local file it shows a sample number.</p>
    </div>
</section>
<!-- SECTION END: waitlist -->
</body>
</html>
