<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Split | ELYWARE Kit</title>
    <meta name="robots" content="noindex">
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../kit.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<!-- SECTION START: hero-split -->
<section class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="container hero-split">
        <div class="stack">
            <span class="badge"><span class="dot"></span> Now booking fall projects</span>
            <h1>Software and marketing that <span class="gradient-text">ships this month.</span></h1>
            <p class="lead">One sentence on what you do and who it is for. A second sentence with the proof.</p>
            <div class="btn-row">
                <a class="btn btn-primary btn-lg" href="#contact">Start a project</a>
                <a class="btn btn-ghost btn-lg" href="#features">See how it works</a>
            </div>
            <p class="hero-note">No retainers. Fixed quotes in 48 hours.</p>
        </div>
        <div class="media" style="--ratio: 4 / 3"><span class="media-label">hero visual 4:3</span></div>
    </div>
</section>
<!-- SECTION END: hero-split -->
</body>
</html>
