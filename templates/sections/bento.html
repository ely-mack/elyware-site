<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<body>
<!-- SECTION START: bento -->
<section class="section" id="highlights">
    <div class="container">
        <div class="section-head stack">
            <span class="eyebrow">Highlights</span>
            <h2>One grid. Every reason to come back.</h2>
        </div>
        <div class="bento">
            <a class="tile big" href="#">
                <div class="media" aria-hidden="true"></div>
                <span class="eyebrow">Featured</span>
                <h3>Lead tile for the main story</h3>
                <p class="reveal">Hover or focus shows this second line. On touch screens it is always visible.</p>
            </a>
            <a class="tile wide" href="#">
                <div class="media" aria-hidden="true"></div>
                <h3>Wide tile</h3>
                <p class="reveal">Good for a second product or a recap video.</p>
            </a>
            <a class="tile" href="#">
                <h3>Small tile</h3>
                <p class="reveal">One fact.</p>
            </a>
            <a class="tile" href="#">
                <h3>Small tile</h3>
                <p class="reveal">One fact.</p>
            </a>
        </div>
    </div>
</section>
<!-- SECTION END: bento -->
