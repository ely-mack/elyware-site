<main id="main">
<section class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="container hero-center stack">
        <span class="eyebrow">Coming soon</span>
        <h1 class="display">Something new is <span class="gradient-text">loading.</span></h1>
        <p class="lead">One line on what is launching and why it matters. Get on the list for first access.</p>
        <form class="signup" name="waitlist" method="POST" data-netlify="true" netlify-honeypot="bot-field" data-signup data-success="You are on the list. Watch your inbox.">
            <input type="hidden" name="form-name" value="waitlist">
            <p class="hidden-field"><label>Leave this empty <input name="bot-field"></label></p>
            <label class="sr-only" for="waitlist-email">Email address</label>
            <input class="field" id="waitlist-email" type="email" name="email" placeholder="you@email.com" autocomplete="email" required>
            <button class="btn btn-primary" type="submit">Notify me</button>
        </form>
        <p class="form-status" role="status" aria-live="polite"></p>
    </div>
</section>
<section class="section" aria-label="Launch countdown">
    <div class="container hero-center stack">
        <span class="eyebrow">Doors open in</span>
        <div class="countdown" data-countdown="2026-12-31T20:00:00-07:00" role="timer" aria-label="Time until launch">
            <div><strong data-unit="days">00</strong><span>Days</span></div>
            <div><strong data-unit="hours">00</strong><span>Hours</span></div>
            <div><strong data-unit="minutes">00</strong><span>Min</span></div>
            <div><strong data-unit="seconds">00</strong><span>Sec</span></div>
        </div>
    </div>
</section>
