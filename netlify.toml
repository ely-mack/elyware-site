[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# Canonical host: send www to the apex domain so search engines see one URL.
[[redirects]]
  from = "https://www.elyware.net/*"
  to = "https://elyware.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/video-mixer"
  to = "/video-mixer/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/analytics"
  to = "/analytics/"
  status = 301

[[redirects]]
  from = "/games/automotown"
  to = "/games/automotown/"
  status = 301

[[redirects]]
  from = "/games/stick-figure-army"
  to = "/games/stick-figure-army/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/games/automotown/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/analytics/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow"
